name: 驗證內容

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - ".vitepress/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".vitepress/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: node scripts/validate-filenames.js
      - run: npx markdownlint-cli2 'docs/**/*.md' --config .markdownlint.yml

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run docs:build
